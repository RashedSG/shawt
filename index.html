<style>
:root,:root.dark,html.dark{
  --bg:#1C1C1C;--text:#F4F4F4;--text-dim:#B4B4B4;--card:#2A2A2A;--card-border:#3E3E3E;
  --header-bg:rgba(28,28,28,.92);--shadow:0 8px 28px rgba(0,0,0,.35);
  --primary:#00E59A;--primary-dim:#00c47f;
  --font-ar:'Noto Sans Arabic','Inter',system-ui,sans-serif;
  --font-en:'Inter','Noto Sans Arabic',system-ui,sans-serif;
  --font-brand:'Inter','Noto Sans Arabic',system-ui,sans-serif;
}
html.light{
  --bg:#F6F4F0;--text:#161513;--text-dim:#5A564F;--card:#FFFFFF;--card-border:#DDD8D0;
  --header-bg:rgba(246,244,240,.94);--shadow:0 2px 16px rgba(28,24,18,.08);
  --primary:#0B8F62;--primary-dim:#087352;
}
header.site{background:var(--header-bg)!important}
.logo{display:flex;align-items:center;gap:0;flex:0 0 auto;line-height:1;color:inherit;text-decoration:none;background:transparent}
.logo-lockup{height:40px;width:auto;display:block;background:transparent}
footer .logo-lockup{height:44px}
.logo-on-light{display:none}
html.light .logo-on-dark{display:none}
html.light .logo-on-light{display:block}
.drawer{
  inset-inline-start:0!important;inset-inline-end:auto!important;
  right:auto!important;left:auto!important;
  transform:translateX(-110%);
}
html[dir="rtl"] .drawer{transform:translateX(110%)}
html[dir="ltr"] .drawer.open,
html[dir="rtl"] .drawer.open,
.drawer.open{
  visibility:visible!important;
  pointer-events:auto!important;
  transform:translateX(0)!important;
}
html,body,html[lang="ar"] body{font-family:var(--font-ar)!important;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--font-en)!important}
h1,h2,h3,.logo,.stat-val,.q-text{font-family:var(--font-brand)!important}
html[lang="ar"] body{text-rendering:optimizeLegibility}
.hero h1{line-height:1.22;text-wrap:balance;overflow-wrap:normal;hyphens:none;margin-top:10px}
.hero p.lead{line-height:1.8;text-wrap:pretty;max-width:36rem}
h1,h2,h3{text-wrap:balance;line-height:1.3}
.trust-badges{justify-content:flex-start}
.bout-card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow)}
.bout-kicker{color:var(--primary);font-weight:700;font-size:12.5px;margin-bottom:6px}
.bout-path{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin:16px 0}
.bout-path img{width:120px;height:88px;object-fit:cover;border-radius:12px}
.terrain-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;color:var(--text-dim);font-size:13px;font-weight:600}
.terrain-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--card-border)}
.terrain-chip.t-flat{background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);border-color:transparent}
.terrain-chip.t-roll{background:color-mix(in srgb, var(--secondary) 14%, transparent)}
.terrain-chip.t-climb{background:color-mix(in srgb, var(--warning) 18%, transparent);color:#8a6b0f}
.heat-note{font-size:13px;color:var(--text-dim);margin:8px 0 16px;padding-top:10px;border-top:1px dashed var(--card-border)}
.path-card .terrain-chip{margin-bottom:8px}
.steps-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.terrain-legend{margin-top:8px}
@media (max-width:720px){
  .hero h1{font-size:clamp(26px,8.2vw,36px)}
  .hero p.lead{font-size:15px}
  .bout-path{grid-template-columns:1fr}
  .bout-path img{width:100%;height:140px}
  .steps-3{grid-template-columns:1fr}
}
</style>
</head>

<script>
Object.assign(T.ar,{nav_home:"اليوم",nav_weather:"الحر ملاحظة",hero_eyebrow:"المسار أولًا",hero_title:"الشوط يُقاس على الأرض\nلا في الطقس وحده",hero_lead:"تختار التضاريس، ثم المدة، ثم الإيقاع. الحر يُراعى في سطر واحد بعد أن يستقر المسار.",hero_cta1:"ابنِ خطتي من مساري",trust1:"مسطح · تموج · تلّ",trust2:"رقم من الميدان",trust3:"الحر ثانوي",cta_start:"ابدأ الشوط"});
Object.assign(T.en,{nav_home:"Today",nav_weather:"Heat note",hero_eyebrow:"Route first",hero_title:"The bout is measured on the ground\nnot by weather alone",hero_lead:"Pick terrain, then duration, then pace. Heat is one line after the route is set.",hero_cta1:"Build my plan from my routes",trust1:"Flat · Roll · Climb",trust2:"A field number",trust3:"Heat is secondary",cta_start:"Start the bout"});
(function(){
  var META={dark:'#1C1C1C',light:'#F6F4F0'};
  function lang(){
    try{ if(typeof state!=='undefined' && state && state.lang) return state.lang; }catch(e){}
    return document.documentElement.lang||'ar';
  }
  function currentTheme(){
    try{ if(typeof state!=='undefined' && state && state.theme==='light') return 'light'; }catch(e){}
    return document.documentElement.classList.contains('light')?'light':'dark';
  }
  function paintTheme(theme){
    theme = theme==='light' ? 'light' : 'dark';
    try{ if(typeof state!=='undefined' && state){ state.theme=theme; if(typeof persist==='function') persist(); } }catch(e){}
    var root=document.documentElement;
    root.classList.remove('light','dark','sport','heat');
    root.classList.add(theme);
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', META[theme]);
    var b=document.getElementById('themeToggle');
    if(b && typeof icon==='function'){
      b.innerHTML=icon(theme==='light'?'moon':'sun',17);
      b.setAttribute('aria-label', lang()==='ar'?'تبديل المظهر':'Switch theme');
    }
  }
  window.setTheme=paintTheme;
  var themeBtn=document.getElementById('themeToggle');
  if(themeBtn){
    themeBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopImmediatePropagation();
      paintTheme(currentTheme()==='light'?'dark':'light');
    }, true);
  }
  function openMenu(e){
    if(e) e.stopImmediatePropagation();
    var d=document.getElementById('drawer');
    var bg=document.getElementById('drawerBg');
    var btn=document.getElementById('menuToggle');
    if(!d) return;
    d.classList.add('open');
    if(bg) bg.classList.add('open');
    document.documentElement.classList.add('nav-open');
    if(btn) btn.setAttribute('aria-expanded','true');
  }
  var menuBtn=document.getElementById('menuToggle');
  if(menuBtn) menuBtn.addEventListener('click', openMenu, true);
  function patchThemeSelect(){
    var sel=document.getElementById('accThemeSelect');
    if(!sel) return;
    var cur=currentTheme();
    var ar=lang()==='ar';
    sel.innerHTML=
      '<option value="dark"'+(cur==='dark'?' selected':'')+'>'+(ar?'ليلي':'Night')+'</option>'+
      '<option value="light"'+(cur==='light'?' selected':'')+'>'+(ar?'نهاري':'Day')+'</option>';
    sel.onchange=function(){ paintTheme(sel.value); };
  }
  function formatHero(){
    document.querySelectorAll('[data-t="hero_title"],[data-t="hero_lead"]').forEach(function(el){
      el.innerHTML=String(t(el.getAttribute('data-t'))).replace(/\n/g,'<br>');
    });
    patchThemeSelect();
  }
  var oT=window.applyTranslations;
  window.applyTranslations=function(){ if(typeof oT==='function') oT(); formatHero(); };
  var oN=window.navigate;
  if(typeof oN==='function'){
    window.navigate=function(){ oN.apply(this,arguments); formatHero(); };
  }
  formatHero();
  paintTheme(currentTheme());
})();
</script>
